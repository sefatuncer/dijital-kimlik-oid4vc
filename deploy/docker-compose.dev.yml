# Yerel geliştirme altyapısı. Uygulamalar Windows'ta (dotnet run) çalışır, bağımlılıklar konteynerde.
# Kullanım: scripts/dev-veritabani.ps1 (şifreleri üretir ve bu dosyayı çalıştırır)
name: dijital-kimlik-dev

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dk-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Şifre deploy/dev.local.env dosyasından gelir; o dosya git'e girmez.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?deploy/dev.local.env içinde MSSQL_SA_PASSWORD tanımlı olmalı}
    ports:
      - "127.0.0.1:1433:1433"   # yalnız bu makineden erişilir, ağa açılmaz
    volumes:
      - dk-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  dk-mssql-data:
